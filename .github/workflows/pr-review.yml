name: PR review (Alpha)

# Alpha reviews its own pull requests: `alpha -p "/review <n> --deep"`
# collects the diff through `gh`, three sub-agents review it in parallel,
# the main agent verifies their findings and the workflow posts the result
# as ONE comment (edited in place on every push). Needs the repository
# secret ALPHA_REVIEW_API_KEY (a DeepSeek key, or set ALPHA_PROVIDER +
# the matching *_API_KEY name below). Without it the job exits early, and
# PRs from forks / Dependabot never see secrets, so they are skipped too.
# The model runs with approvals DENIED (`-p` default) — it only reads.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      GH_TOKEN: ${{ github.token }}
      ALPHA_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${{ secrets.ALPHA_REVIEW_API_KEY }}
      ALPHA_SUBAGENT_MAX_SECONDS: "300"
      ALPHA_NO_MEMORY: "1"
      ALPHA_BROWSER_TOOLS: "0"
      ALPHA_NOTIFY: "off"
    steps:
      - name: Skip without API key
        id: gate
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "ALPHA_REVIEW_API_KEY not set — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.gate.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install alpha-code
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Review the pull request
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -o pipefail
          alpha -p "/review $PR --deep" --output-format json > review.json
          python - <<'EOF'
          import json, pathlib
          r = json.load(open("review.json"))
          body = (r.get("reply") or "").strip() or "_Alpha produced no review output._"
          if r.get("error"):
              body += f"\n\n> ⚠ run ended with error: `{r['error']}`"
          cost = r.get("cost_usd")
          tail = f" · ${cost:.3f}" if isinstance(cost, (int, float)) else ""
          pathlib.Path("review.md").write_text(
              "<!-- alpha-pr-review -->\n"
              f"{body}\n\n---\n_Generated by [Alpha](https://github.com/freire19/Alpha_Code) "
              f"`/review --deep` ({r.get('turns', '?')} turn(s){tail}). "
              "Findings were machine-verified against the diff but still need a human read._\n"
          )
          EOF

      - name: Post or update the comment
        if: steps.gate.outputs.skip != 'true'
        run: |
          # One comment per PR: edit the bot's last comment when it exists.
          gh pr comment "$PR" --body-file review.md --edit-last \
            || gh pr comment "$PR" --body-file review.md
