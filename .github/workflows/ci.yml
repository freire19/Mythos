name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          # Versao EXATA, nao faixa: o rule set default do ruff cresce entre
          # minors, entao `>=0.14,<1.0` transformava um release upstream em
          # CI vermelho sem ninguem tocar no codigo — foi o que aconteceu com
          # a 0.16, que passou a acusar 526 erros (I001/BLE001/S*/UP*) num
          # codebase inalterado. Bump e deliberado: suba a versao aqui e
          # rode `ruff check` local no mesmo pin antes de commitar.
          pip install "ruff==0.15.21"

      # `ruff check` runs the lint gate (config in pyproject.toml). Targets
      # 3.11 so the 3.12-only f-string quote-reuse fails here, not at a
      # 3.11 user's import. `--output-format=github` annotates the PR diff.
      - name: Run ruff
        run: ruff check --output-format=github alpha/ tests/ main.py

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13/3.14 added 2026-11-03 after the suite passed in both
        # python:<v>-slim containers; the Docker image may run either.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest with coverage gate
        env:
          # Tests must not depend on real credentials.
          ALPHA_PROVIDER: deepseek
        # The --cov-fail-under threshold lives in pyproject.toml so
        # local `pytest --cov=alpha` honors the same gate as CI.
        run: pytest -q --tb=short --cov=alpha --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        # Cota de storage de artifacts da conta pode estourar (erro 4xx no
        # upload) — isso não pode avermelhar o CI: o artifact é conveniência,
        # o gate de coverage já rodou no passo anterior.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  docker-smoke:
    # The image is the one artifact that runs a Python the test matrix may
    # not cover (Dependabot bumps the base tag independently). Build it and
    # make sure the installed wheel at least imports and prints --help, so a
    # base-image bump can't ship an image that dies at startup. Surfaced by
    # three independent `/review` runs of PR #94.
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Build image
        run: docker build -t alpha-code:ci .

      - name: Smoke the image
        run: |
          docker run --rm alpha-code:ci --help > /dev/null
          docker run --rm --entrypoint python alpha-code:ci \
            -c "import alpha.cli.entry, alpha.sdk, alpha.tools; print('import ok')"
          docker run --rm --entrypoint python alpha-code:ci \
            -c "import sys; print('python', sys.version.split()[0])"

  security-audit:
    # DEEP_SECURITY V3.3 #033: pip-audit detecta CVEs em dependencias
    # automaticamente. Antes deste step, a CVE-2026-45409 idna 3.11 (#005)
    # passou meses sem deteccao. Rodado em job separado para isolar
    # falhas de cobertura/lint vs falhas de seguranca de deps.
    name: Audit dependencies for CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit on lockfile
        # `--strict` falha o build em vulneraveis. `--requirement` audita
        # o lockfile exato que vai pra producao em vez de re-resolver deps.
        run: pip-audit --strict --requirement requirements.lock
